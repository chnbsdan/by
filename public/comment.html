<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言反馈</title>
  <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.41/dist/twikoo.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px 20px 30px;
      min-height: 100vh;
    }
    #tcomment {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ★★★ 暴力覆盖 ★★★ */

    /* 隐藏右侧滚动条（整个页面） */
    ::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-thumb {
      background: transparent !important;
    }
    ::-webkit-scrollbar-track {
      background: transparent !important;
    }

    /* ★★★ 昵称/邮箱/网址 一排 ★★★ */
    .tk-input .el-form-item {
      display: inline-block !important;
      width: 30% !important;
      margin-right: 3% !important;
      vertical-align: top !important;
      float: none !important;
      clear: none !important;
    }
    .tk-input .el-form-item:last-child {
      margin-right: 0 !important;
    }

    /* 如果 .el-form-item 内部还有 flex，强制覆盖 */
    .tk-input .el-form-item .el-form-item__content {
      display: block !important;
      margin-left: 0 !important;
    }

    .tk-input .el-form-item .el-form-item__label {
      display: block !important;
      font-size: 12px !important;
      color: #888 !important;
      padding: 0 !important;
      line-height: 1.5 !important;
      text-align: left !important;
      width: 100% !important;
    }

    .tk-input .el-form-item .el-input__inner {
      width: 100% !important;
      padding: 6px 10px !important;
      border: 1px solid #ddd !important;
      border-radius: 6px !important;
      font-size: 13px !important;
      background: #f8f8f8 !important;
      height: 36px !important;
      line-height: 36px !important;
    }

    /* 评论输入框 */
    .tk-input .el-textarea__inner {
      border: 1px solid #ddd !important;
      border-radius: 6px !important;
      padding: 10px !important;
      font-size: 14px !important;
      background: #f8f8f8 !important;
      min-height: 80px !important;
    }

    /* ★★★ 隐藏评论列表的滚动条 ★★★ */
    .tk-comments-container {
      max-height: 400px !important;
      overflow-y: auto !important;
    }
    .tk-comments-container::-webkit-scrollbar {
      width: 0 !important;
    }

    /* 提交按钮 */
    .tk-submit .el-button {
      background: #4fc3f7 !important;
      color: #fff !important;
      border: none !important;
      padding: 8px 24px !important;
      border-radius: 6px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      cursor: pointer !important;
    }

    /* 评论区标题 */
    .tk-meta {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid #f0f0f0 !important;
      margin-bottom: 12px !important;
    }

    /* 单条评论 */
    .tk-comment {
      padding: 12px 0 !important;
      border-bottom: 1px solid #f0f0f0 !important;
    }

    /* 移动端 */
    @media (max-width: 600px) {
      .tk-input .el-form-item {
        display: block !important;
        width: 100% !important;
        margin-right: 0 !important;
        margin-bottom: 10px !important;
      }
    }
  </style>
</head>
<body>
  <div id="tcomment"></div>
  <script>
    function initTwikoo() {
      if (typeof twikoo !== 'undefined') {
        try {
          twikoo.init({
            envId: 'https://twikoo.hangdn.net',
            el: '#tcomment',
            lang: 'zh-CN',
          })
          console.log('✅ 评论加载成功')
        } catch (e) {
          console.warn('评论初始化失败:', e)
          document.getElementById('tcomment').innerHTML =
            '<p style="color:#999;text-align:center;padding:40px;">评论加载失败，请刷新重试</p>'
        }
      } else {
        setTimeout(initTwikoo, 500)
      }
    }

    if (document.readyState === 'complete') {
      initTwikoo()
    } else {
      document.addEventListener('DOMContentLoaded', initTwikoo)
    }

    setTimeout(() => {
      const container = document.getElementById('tcomment')
      if (container && !container.querySelector('.tk-comment') && !container.querySelector('.tk-loading')) {
        container.innerHTML =
          '<p style="color:#999;text-align:center;padding:40px;">评论加载超时，请<a href="javascript:location.reload()" style="color:#4fc3f7;">刷新页面</a>重试</p>'
      }
    }, 10000)
  </script>
</body>
</html>
